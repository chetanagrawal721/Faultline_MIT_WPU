[project]
name = "acme-drivers"
version = "0.1.0"
description = "Connection pool (Faultline fixture, Hint severity). It refers to no package whose version differs, and needs a database driver that neither world installs,"
requires-python = ">=3.9"
dependencies = ["pydantic>=1.10,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acme_drivers"]
