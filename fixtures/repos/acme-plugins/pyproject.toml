[project]
name = "acme-plugins"
version = "0.1.0"
description = "Plugin registry (Faultline fixture, Information severity). It looks plugins up on pydantic by name at run time, so no static reading can say which"
requires-python = ">=3.9"
dependencies = ["pydantic>=1.10,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acme_plugins"]
